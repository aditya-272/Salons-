<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17221e"><meta name="description" content="Mobile-first salon customer, booking, wallet, reminder and referral prototype"><link rel="manifest" href="manifest.json"><title>SalonLoop — Salon App</title>
<style>
:root{--ink:#17221e;--muted:#66716b;--paper:#f5f5ef;--card:#fff;--line:#e0e5de;--green:#2f6b4f;--lime:#d6f078;--red:#b54b43;--shadow:0 8px 24px #17221e0b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--ink);color:white;font-weight:650}button.secondary{background:#edf1eb;color:var(--ink)}button.green{background:var(--green)}button.danger{background:#fff0ed;color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink);min-width:0}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}.app{max-width:1180px;margin:auto;min-height:100dvh}.top{background:var(--ink);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:5}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;font-size:21px;letter-spacing:-.7px}.brand span{color:var(--lime)}.sub{font-size:12px;color:#c5d0c8;margin-top:2px}.pill{font-size:11px;background:#30433a;color:#e9f2e8;padding:6px 9px;border-radius:30px}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:4}.tabs button{white-space:nowrap;background:transparent;color:var(--muted);padding:9px 12px;font-size:13px}.tabs button.active{background:var(--ink);color:#fff}.main{padding:18px;display:grid;grid-template-columns:1fr;gap:16px}.hero{background:var(--lime);padding:20px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{font-size:25px;line-height:1.12;letter-spacing:-1px;margin:0 0 8px}.hero p{margin:0;color:#344333;max-width:520px}.hero .stamp{font-size:42px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:25px;font-weight:800;letter-spacing:-.8px;margin-top:5px}.metric .hint{font-size:11px;color:var(--muted);margin-top:4px}.panel h2{font-size:17px;letter-spacing:-.3px;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:flex;flex-direction:column;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.item strong{display:block;font-size:14px}.item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.amount{font-weight:800;white-space:nowrap}.tag{display:inline-block;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:750;background:#edf1eb;color:#45544a}.tag.ok{background:#e1f4e8;color:#236541}.tag.warn{background:#fff0d6;color:#875a10}.tag.bad{background:#ffebe7;color:#a13c34}.formgrid{display:grid;grid-template-columns:1fr;gap:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:8px 10px}.muted{color:var(--muted)}.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:13px}.notice{background:#fff7dc;border:1px solid #f0dfa5;color:#6c5416;border-radius:12px;padding:12px;font-size:12px}.hidden{display:none!important}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0}.modalback{position:fixed;inset:0;background:#111b17a8;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--paper);border-radius:22px;padding:18px}.modal h2{margin:0 0 8px}.foot{font-size:11px;color:var(--muted);text-align:center;padding:12px 18px 28px}.split{display:grid;grid-template-columns:1fr;gap:16px}.switch{display:flex;background:#e8ede6;border-radius:12px;padding:4px;gap:4px}.switch button{flex:1;background:transparent;color:var(--muted);padding:8px}.switch button.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #0001}.smallnote{font-size:12px;color:var(--muted)}@media(min-width:760px){.top{padding-left:28px;padding-right:28px}.tabs{padding-left:28px}.main{padding:26px 28px;grid-template-columns:1.15fr .85fr}.main.full{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr;column-gap:12px}.hero h1{font-size:31px}.modalback{align-items:center}}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div><div class="brand">DIVINE<span> SALON</span></div><div class="sub">A repeat-customer system for local salons</div></div><span class="pill" id="modePill">OWNER MODE</span></div></header><nav class="tabs" id="tabs"></nav><main id="main" class="main"></main><div class="foot">SalonLoop prototype · Data is saved only in this browser on this device.</div></div><div id="modalHost"></div>
<script>
const $=s=>document.querySelector(s);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+Number(n));return x.toISOString().slice(0,10)};const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
const defaults={salon:{name:'Your Salon',hours:'10:00–20:00'},services:[{id:'s1',name:'Haircut',category:'Hair',price:200,duration:30,cycle:28,active:true},{id:'s2',name:'Beard Trim',category:'Grooming',price:100,duration:15,cycle:12,active:true},{id:'s3',name:'Hair Colour',category:'Hair',price:800,duration:75,cycle:35,active:true},{id:'s4',name:'Facial',category:'Skin',price:500,duration:45,cycle:35,active:true},{id:'s5',name:'Head Massage',category:'Add-on',price:199,duration:15,cycle:30,active:true}],staff:[{id:'st1',name:'Rahul',active:true},{id:'st2',name:'Aman',active:true},{id:'st3',name:'Vikash',active:true}],customers:[{id:'c1',name:'Demo Customer',phone:'9000000001',consent:false,created:today(),lastVisit:plus(today(),-28),lastService:'s1'}],bookings:[],visits:[],wallet:[],referrals:[],reminders:[],settings:{bonus:10,minimumTopup:300,expiryDays:365,referrerReward:100,newCustomerDiscount:100,reminderEnabled:true}};
let db;try{db=JSON.parse(localStorage.getItem('salonloop_db'))||structuredClone(defaults)}catch{db=structuredClone(defaults)}let tab='Dashboard',view='owner';function save(){localStorage.setItem('salonloop_db',JSON.stringify(db))}function service(id){return db.services.find(x=>x.id===id)||{name:'Unknown service',price:0,duration:0,cycle:28}}function customer(id){return db.customers.find(x=>x.id===id)||{name:'Unknown customer',phone:'—'}}function staff(id){return db.staff.find(x=>x.id===id)||{name:'Any available staff'}}function fmtDate(d){if(!d)return'—';return new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}function status(s){let cls=['Completed','Confirmed','Credited','Rewarded','Delivered','Successful'].includes(s)?'ok':['Pending','Scheduled','Payment pending'].includes(s)?'warn':['Cancelled','No-show','Failed','Rejected','Opted out'].includes(s)?'bad':'';return `<span class="tag ${cls}">${s}</span>`}function addItem(arr,obj){arr.unshift({id:uid(),...obj});save()}function walletBalance(cid){return db.wallet.filter(x=>x.customerId===cid).reduce((n,x)=>n+Number(x.delta||0),0)}function totals(){let completed=db.bookings.filter(b=>b.status==='Completed');return{revenue:completed.reduce((n,b)=>n+Number(b.total||0),0),todayBookings:db.bookings.filter(b=>b.date===today()&&!['Cancelled'].includes(b.status)).length,repeat:new Set(db.visits.filter(v=>v.customerId).map(v=>v.customerId)).size,newCustomers:db.customers.filter(c=>c.created?.slice(0,7)===today().slice(0,7)).length,avg:completed.length?completed.reduce((n,b)=>n+Number(b.total||0),0)/completed.length:0,walletCollected:db.wallet.filter(w=>w.type==='topup').reduce((n,w)=>n+Number(w.paid||0),0),walletOutstanding:db.customers.reduce((n,c)=>n+Math.max(0,walletBalance(c.id)),0),reminderBookings:db.bookings.filter(b=>b.source==='reminder').length}}
const nav=['Dashboard','Bookings','Customers','Services','Wallet','Reminders','Referrals','Reports','Settings'];function render(){ $('#modePill').textContent=view.toUpperCase()+' MODE';$('#tabs').innerHTML=(view==='owner'?nav:['My Wallet','Book Visit','Refer & Earn','My Visits']).map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let el=$('#main');el.className='main '+(['Customers','Services','Bookings','Wallet','Reminders','Referrals','Reports','Settings','My Wallet','Book Visit','Refer & Earn','My Visits'].includes(tab)?'full':'');let fn={'Dashboard':dashboard,'Bookings':bookings,'Customers':customers,'Services':services,'Wallet':walletPage,'Reminders':reminders,'Referrals':referrals,'Reports':reports,'Settings':settings,'My Wallet':myWallet,'Book Visit':bookVisit,'Refer & Earn':referEarn,'My Visits':myVisits}[tab]||dashboard;el.innerHTML=fn();wire()}
function dashboard(){let t=totals(),due=db.customers.filter(c=>c.lastVisit&&plus(c.lastVisit,service(c.lastService).cycle)<=today());return `<section><div class="hero"><div><h1>Make every visit<br>count again.</h1><p>Track customers, bring them back at the right time, and understand what drives revenue.</p></div><div class="stamp">✂️</div></div><div class="grid" style="margin-top:14px"><div class="metric"><div class="k">Completed revenue</div><div class="v">${money(t.revenue)}</div><div class="hint">Recorded completed bookings</div></div><div class="metric"><div class="k">Today's bookings</div><div class="v">${t.todayBookings}</div><div class="hint">Not cancelled</div></div><div class="metric"><div class="k">Average bill</div><div class="v">${money(t.avg)}</div><div class="hint">Completed bookings only</div></div><div class="metric"><div class="k">Due for a visit</div><div class="v">${due.length}</div><div class="hint">Based on last service cycle</div></div><div class="metric"><div class="k">New customers this month</div><div class="v">${t.newCustomers}</div></div><div class="metric"><div class="k">Wallet credit collected</div><div class="v">${money(t.walletCollected)}</div></div><div class="metric"><div class="k">Outstanding salon credit</div><div class="v">${money(t.walletOutstanding)}</div></div><div class="metric"><div class="k">Reminder bookings</div><div class="v">${t.reminderBookings}</div></div></div><div class="notice" style="margin-top:14px">Prototype note: payments, OTP, WhatsApp/SMS and scheduled background reminders are simulated/not connected. Never use real customer payment data here.</div></section><section class="panel"><div class="sectionhead"><h2>Quick actions</h2></div><div class="list"><button data-go="Bookings">＋ Create booking / walk-in</button><button class="secondary" data-go="Customers">＋ Add customer</button><button class="secondary" data-go="Reminders">View due reminders (${due.length})</button><button class="secondary" data-go="Wallet">Record wallet transaction</button></div><h2 style="margin-top:22px">Upcoming bookings</h2>${bookingList(db.bookings.filter(b=>['Pending','Confirmed'].includes(b.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5))}</section>`}
function bookingList(list){if(!list.length)return'<div class="empty">No bookings yet. Create a booking to start tracking visits.</div>';return `<div class="list">${list.map(b=>`<div class="item"><div><strong>${customer(b.customerId).name} · ${service(b.serviceId).name}</strong><small>${fmtDate(b.date)} ${b.time||''} · ${staff(b.staffId).name} · ${money(b.total)}</small><small>${status(b.status)} ${b.source==='reminder'?' · reminder booking':''}</small><div class="actions">${b.status!=='Completed'?`<button data-complete="${b.id}" class="green">Mark completed</button>`:''}${b.status!=='Cancelled'&&b.status!=='Completed'?`<button data-cancel="${b.id}" class="secondary">Cancel</button>`:''}</div></div></div>`).join('')}</div>`}
function bookings(){return `<section class="panel"><div class="sectionhead"><h2>Create booking / walk-in</h2></div><form id="bookingForm"><div class="formgrid"><div><label>Customer</label><select name="customerId" required>${db.customers.map(c=>`<option value="${c.id}">${c.name} · ${c.phone}</option>`).join('')}</select></div><div><label>Service</label><select name="serviceId" id="bookService">${db.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name} · ${money(s.price)} · ${s.duration} min</option>`).join('')}</select></div><div><label>Date</label><input type="date" name="date" min="${today()}" value="${today()}" required></div><div><label>Time</label><input type="time" name="time" value="11:00" required></div><div><label>Staff</label><select name="staffId"><option value="">Any available staff</option>${db.staff.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div><label>Optional add-on</label><select name="addonId" id="addonSelect"><option value="">No add-on</option>${db.services.filter(s=>s.active&&s.category==='Add-on').map(s=>`<option value="${s.id}">${s.name} · ${money(s.price)} (+${s.duration} min)</option>`).join('')}</select></div></div><div class="metric" style="margin:12px 0"><div class="k">Transparent booking total</div><div class="v" id="bookingTotal">—</div><div class="hint" id="bookingDuration">—</div></div><button class="green" type="submit">Confirm booking</button></form></section><section class="panel"><div class="sectionhead"><h2>Booking list</h2><select id="bookingFilter" style="max-width:170px"><option>All</option><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option><option>No-show</option></select></div><div id="bookingResults">${bookingList(db.bookings.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)))}</div></section>`}
function customers(){return `<section class="panel"><h2>Add customer</h2><form id="customerForm"><div class="formgrid"><div><label>Full name</label><input name="name" required placeholder="Customer name"></div><div><label>Mobile number</label><input name="phone" inputmode="tel" pattern="[0-9+ -]{8,16}" required placeholder="10-digit number"></div><div><label>Last service (if known)</label><select name="lastService"><option value="">Not recorded yet</option>${db.services.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div><label>Last visit date (if known)</label><input name="lastVisit" type="date" max="${today()}"></div></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="consent" style="width:auto"> Customer agreed to receive reminders/promotions</label><button class="green" type="submit">Save customer</button></form></section><section class="panel"><div class="sectionhead"><h2>Customers (${db.customers.length})</h2><input id="customerSearch" placeholder="Search name or phone" style="max-width:260px"></div><div class="list" id="customerResults">${customerList(db.customers)}</div></section>`}
function customerList(list){if(!list.length)return'<div class="empty">No matching customers.</div>';return `<div class="list">${list.map(c=>`<div class="item"><div><strong>${c.name}</strong><small>${c.phone} · Last visit: ${fmtDate(c.lastVisit)}</small><small>${c.consent?'<span class="tag ok">Reminder consent</span>':'<span class="tag warn">No marketing consent</span>'} · Wallet ${money(walletBalance(c.id))}</small><div class="actions"><button data-cwallet="${c.id}" class="secondary">Wallet action</button><button data-creminder="${c.id}" class="secondary">Create reminder</button></div></div></div>`).join('')}</div>`}
function services(){return `<section class="panel"><h2>Add a service or add-on</h2><form id="serviceForm"><div class="formgrid"><div><label>Name</label><input name="name" required placeholder="e.g. Beard Trim"></div><div><label>Category</label><select name="category"><option>Hair</option><option>Grooming</option><option>Skin</option><option>Add-on</option><option>Other</option></select></div><div><label>Price (₹)</label><input name="price" type="number" min="0" step="1" required></div><div><label>Duration (minutes)</label><input name="duration" type="number" min="1" required value="30"></div><div><label>Repeat cycle (days)</label><input name="cycle" type="number" min="1" value="28" required></div></div><button class="green" type="submit">Add service</button></form></section><section class="panel"><h2>Service catalogue</h2><div class="list">${db.services.map(s=>`<div class="item"><div><strong>${s.name} ${!s.active?'<span class="tag bad">Inactive</span>':''}</strong><small>${s.category} · ${s.duration} min · Repeat after ${s.cycle} days</small></div><div style="text-align:right"><div class="amount">${money(s.price)}</div><div class="actions"><button data-editservice="${s.id}" class="secondary">Edit</button><button data-toggle-service="${s.id}" class="${s.active?'danger':'green'}">${s.active?'Disable':'Enable'}</button></div></div></div>`).join('')}</div></section>`}
function walletPage(){return `<section class="panel"><h2>Record salon-credit transaction</h2><div class="notice">Store credit only, not a cash wallet. This prototype records a simulated payment state—no real payment is collected.</div><form id="walletForm"><label>Customer</label><select name="customerId">${db.customers.map(c=>`<option value="${c.id}">${c.name} · Balance ${money(walletBalance(c.id))}</option>`).join('')}</select><label>Action</label><select name="type"><option value="topup">Top-up (simulated payment confirmed)</option><option value="use">Use credit at checkout</option><option value="adjust">Owner adjustment</option><option value="refund">Refund / reversal</option></select><div class="formgrid"><div><label>Amount paid / debit (₹)</label><input name="amount" type="number" min="1" required></div><div><label>Bonus credit (₹, top-up only)</label><input name="bonus" type="number" min="0" value="${db.settings.bonus}" required></div></div><label>Reason (mandatory for adjustment/refund)</label><input name="reason" placeholder="Reason for transaction"><button class="green" type="submit">Record transaction</button></form></section><section class="panel"><h2>Wallet balances</h2><div class="list">${db.customers.map(c=>`<div class="item"><div><strong>${c.name}</strong><small>${c.phone} · Paid top-ups ${money(db.wallet.filter(w=>w.customerId===c.id&&w.type==='topup').reduce((n,w)=>n+(w.paid||0),0))}</small></div><div class="amount">${money(walletBalance(c.id))}</div></div>`).join('')}</div><h2 style="margin-top:20px">Immutable transaction history</h2>${db.wallet.length?`<div class="list">${db.wallet.map(w=>`<div class="item"><div><strong>${customer(w.customerId).name} · ${w.label}</strong><small>${fmtDate(w.date)} · ${w.reason||'—'} · balance after ${money(w.balanceAfter)}</small></div><div class="amount">${w.delta>=0?'+':'−'}${money(Math.abs(w.delta))}</div></div>`).join('')}</div>`:'<div class="empty">No wallet transactions yet.</div>'}</section>`}
function reminders(){let rows=db.customers.filter(c=>c.lastVisit&&c.lastService).map(c=>({c,due:plus(c.lastVisit,service(c.lastService).cycle)})).sort((a,b)=>a.due.localeCompare(b.due));return `<section class="panel"><div class="sectionhead"><h2>Service-due reminders</h2><button id="queueReminders" class="green">Queue due reminders</button></div><p class="smallnote">Due date = last visit + service-specific repeat cycle. This screen queues reminders in the app; it does not send SMS/WhatsApp in the background.</p><div class="list">${rows.length?rows.map(({c,due})=>`<div class="item"><div><strong>${c.name} · ${service(c.lastService).name}</strong><small>Last visit ${fmtDate(c.lastVisit)} · Suggested next visit ${fmtDate(due)}</small><small>${due<=today()?'<span class="tag warn">Due now</span>':'<span class="tag">Upcoming</span>'} ${c.consent?'':' · No promotional consent'}</small><div class="actions"><button data-creminder="${c.id}" class="secondary">Queue reminder</button><button data-remindbook="${c.id}" class="green">Book visit</button></div></div></div>`).join(''):'<div class="empty">Add customer visit history to calculate due dates.</div>'}</div><h2 style="margin-top:20px">Reminder queue / history</h2>${db.reminders.length?`<div class="list">${db.reminders.map(r=>`<div class="item"><div><strong>${customer(r.customerId).name}</strong><small>${r.message}</small><small>${fmtDate(r.date)} · ${status(r.status)}</small></div><div class="actions"><button data-remindstatus="${r.id}" class="secondary">Mark delivered (demo)</button></div></div>`).join('')}</div>`:'<div class="empty">No reminders queued.</div>'}</section>`}
function referrals(){return `<section class="panel"><h2>Referral rules</h2><div class="grid"><div class="metric"><div class="k">Referrer reward</div><div class="v">${money(db.settings.referrerReward)}</div><div class="hint">Salon credit</div></div><div class="metric"><div class="k">New customer offer</div><div class="v">${money(db.settings.newCustomerDiscount)}</div><div class="hint">Discount on first eligible visit</div></div></div><p class="smallnote">Rewards stay pending until a referred customer completes a paid first visit. In this prototype, owner approval is manual.</p><form id="referralForm"><label>Referring customer</label><select name="referrerId">${db.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><label>New customer's name</label><input name="name" required><label>New customer's phone</label><input name="phone" required inputmode="tel"><button class="green" type="submit">Create pending referral</button></form></section><section class="panel"><h2>Referral tracking</h2>${db.referrals.length?`<div class="list">${db.referrals.map(r=>`<div class="item"><div><strong>${r.name} · ${r.code}</strong><small>Referred by ${customer(r.referrerId).name} · ${r.phone}</small><small>${status(r.status)} · Reward ${money(r.reward)}</small><div class="actions">${r.status==='Pending visit'?`<button data-reward="${r.id}" class="green">Approve after paid visit</button>`:''}<button data-copyref="${r.code}" class="secondary">Copy code</button></div></div></div>`).join('')}</div>`:'<div class="empty">No referrals yet.</div>'}</section>`}
function reports(){let t=totals(),complete=db.bookings.filter(b=>b.status==='Completed');let staffTotals=db.staff.map(s=>({s,rev:complete.filter(b=>b.staffId===s.id).reduce((n,b)=>n+b.total,0),count:complete.filter(b=>b.staffId===s.id).length}));let serviceCounts=db.visits.reduce((a,v)=>(a[v.serviceId]=(a[v.serviceId]||0)+1,a),{});return `<section class="panel"><h2>Business snapshot</h2><div class="grid"><div class="metric"><div class="k">Completed revenue</div><div class="v">${money(t.revenue)}</div></div><div class="metric"><div class="k">Completed bills</div><div class="v">${complete.length}</div></div><div class="metric"><div class="k">Average bill</div><div class="v">${money(t.avg)}</div></div><div class="metric"><div class="k">Repeat customers recorded</div><div class="v">${t.repeat}</div></div></div><div class="actions"><button id="exportCsv">Export bookings CSV</button><button id="exportCustomers" class="secondary">Export customers CSV</button></div></section><section class="panel"><h2>Staff-wise performance</h2><div class="list">${staffTotals.map(x=>`<div class="item"><div><strong>${x.s.name}</strong><small>${x.count} completed services</small></div><div class="amount">${money(x.rev)}</div></div>`).join('')}</div><h2 style="margin-top:20px">Popular services</h2><div class="list">${db.services.map(s=>`<div class="item"><div><strong>${s.name}</strong><small>${serviceCounts[s.id]||0} completed visits</small></div><div class="amount">${money(complete.filter(b=>b.serviceId===s.id).reduce((n,b)=>n+b.total,0))}</div></div>`).join('')}</div></section>`}
function settings(){return `<section class="panel"><h2>Salon setup</h2><form id="settingsForm"><label>Salon name</label><input name="name" value="${db.salon.name}" required><label>Opening hours</label><input name="hours" value="${db.salon.hours}"><div class="formgrid"><div><label>Default wallet bonus (%)</label><input name="bonus" type="number" min="0" max="100" value="${db.settings.bonus}"></div><div><label>Minimum top-up (₹)</label><input name="minimumTopup" type="number" min="0" value="${db.settings.minimumTopup}"></div><div><label>Wallet expiry (days)</label><input name="expiryDays" type="number" min="1" value="${db.settings.expiryDays}"></div><div><label>Referrer reward (₹)</label><input name="referrerReward" type="number" min="0" value="${db.settings.referrerReward}"></div><div><label>New customer discount (₹)</label><input name="newCustomerDiscount" type="number" min="0" value="${db.settings.newCustomerDiscount}"></div></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="reminderEnabled" style="width:auto" ${db.settings.reminderEnabled?'checked':''}> Enable reminder queue</label><button class="green" type="submit">Save settings</button></form></section><section class="panel"><h2>Staff</h2><form id="staffForm"><label>Staff member name</label><input name="name" required><button class="secondary" type="submit">Add staff member</button></form><div class="list" style="margin-top:12px">${db.staff.map(s=>`<div class="item"><div><strong>${s.name}</strong><small>${s.active?'Active':'Inactive'}</small></div><button data-togstaff="${s.id}" class="secondary">${s.active?'Disable':'Enable'}</button></div>`).join('')}</div><div class="notice" style="margin-top:16px">Data management: export CSV from Reports. “Reset demo data” permanently clears this browser's saved app data and restores sample data.</div><button id="resetData" class="danger" style="margin-top:12px">Reset demo data</button></section>`}
function myWallet(){let c=db.customers[0];return `<section class="panel"><h2>My Salon Wallet</h2><p class="smallnote">Demo customer view. This device's first customer profile is shown.</p><div class="hero"><div><div class="muted">Available salon credit</div><h1>${money(walletBalance(c.id))}</h1><p>${c.name} · ${c.phone}</p></div><div class="stamp">◉</div></div><div class="actions"><button data-cwallet="${c.id}">Add / use credit</button><button class="secondary" data-go="Book Visit">Book next visit</button></div><h2 style="margin-top:20px">Transaction history</h2>${db.wallet.filter(w=>w.customerId===c.id).length?`<div class="list">${db.wallet.filter(w=>w.customerId===c.id).map(w=>`<div class="item"><div><strong>${w.label}</strong><small>${fmtDate(w.date)}</small></div><div class="amount">${w.delta>=0?'+':'−'}${money(Math.abs(w.delta))}</div></div>`).join('')}</div>`:'<div class="empty">No transactions recorded.</div>'}</section>`}
function bookVisit(){return `<section class="panel"><h2>Book your next visit</h2><p class="smallnote">Choose a service and slot. Optional add-ons are never preselected.</p>${bookings()}</section>`}
function referEarn(){let c=db.customers[0];return `<section class="panel"><h2>Refer & Earn</h2><div class="hero"><div><h1>Bring a friend.<br>Both get rewarded.</h1><p>Eligible rewards unlock only after their first paid visit.</p></div><div class="stamp">↗</div></div><p>Your demo customer: <strong>${c.name}</strong></p><p>Referrer reward: <strong>${money(db.settings.referrerReward)} salon credit</strong> · New customer offer: <strong>${money(db.settings.newCustomerDiscount)} off</strong></p><button data-copyref="SALON-${c.id}">Copy my demo referral code</button><h2 style="margin-top:20px">My referrals</h2>${db.referrals.filter(r=>r.referrerId===c.id).length?`<div class="list">${db.referrals.filter(r=>r.referrerId===c.id).map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.code}</small></div>${status(r.status)}</div>`).join('')}</div>`:'<div class="empty">No referrals yet.</div>'}</section>`}
function myVisits(){let c=db.customers[0];return `<section class="panel"><h2>My visits & bookings</h2>${bookingList(db.bookings.filter(b=>b.customerId===c.id))}<h2 style="margin-top:20px">Visit history</h2>${db.visits.filter(v=>v.customerId===c.id).length?`<div class="list">${db.visits.filter(v=>v.customerId===c.id).map(v=>`<div class="item"><div><strong>${service(v.serviceId).name}</strong><small>${fmtDate(v.date)} · ${staff(v.staffId).name}</small></div><div class="amount">${money(v.amount)}</div></div>`).join('')}</div>`:'<div class="empty">Completed visits will appear here.</div>'}</section>`}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>completeBooking(b.dataset.complete));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{let x=db.bookings.find(x=>x.id===b.dataset.cancel);if(x){x.status='Cancelled';save();render()}});document.querySelectorAll('[data-cwallet]').forEach(b=>b.onclick=()=>walletModal(b.dataset.cwallet));document.querySelectorAll('[data-creminder]').forEach(b=>b.onclick=()=>queueReminder(b.dataset.creminder));document.querySelectorAll('[data-remindbook]').forEach(b=>b.onclick=()=>{let c=customer(b.dataset.remindbook);tab='Bookings';render();let f=$('#bookingForm');if(f)f.elements.customerId.value=c.id});document.querySelectorAll('[data-remindstatus]').forEach(b=>b.onclick=()=>{let r=db.reminders.find(x=>x.id===b.dataset.remindstatus);if(r){r.status='Delivered';save();render()}});document.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>approveReferral(b.dataset.reward));document.querySelectorAll('[data-copyref]').forEach(b=>b.onclick=()=>copyText(b.dataset.copyref));document.querySelectorAll('[data-toggle-service]').forEach(b=>b.onclick=()=>{let s=service(b.dataset.toggleService);s.active=!s.active;save();render()});document.querySelectorAll('[data-editservice]').forEach(b=>b.onclick=()=>editService(b.dataset.editservice));document.querySelectorAll('[data-togstaff]').forEach(b=>b.onclick=()=>{let s=db.staff.find(x=>x.id===b.dataset.togstaff);s.active=!s.active;save();render()});let bf=$('#bookingForm');if(bf){const update=()=>{let s=service(bf.elements.serviceId.value),a=service(bf.elements.addonId.value);let has=!!bf.elements.addonId.value;$('#bookingTotal').textContent=money(s.price+(has?a.price:0));$('#bookingDuration').textContent=(s.duration+(has?a.duration:0))+' minutes estimated'};bf.elements.serviceId.onchange=update;bf.elements.addonId.onchange=update;update();bf.onsubmit=e=>{e.preventDefault();let f=new FormData(bf),s=service(f.get('serviceId')),a=service(f.get('addonId')),aid=f.get('addonId');let date=f.get('date'),time=f.get('time'),sid=f.get('staffId');let clash=db.bookings.some(b=>b.date===date&&b.time===time&&b.staffId===sid&&sid&&['Pending','Confirmed'].includes(b.status));if(clash){alert('That staff member already has a booking at this time. Choose another slot or staff member.');return}let b={id:uid(),customerId:f.get('customerId'),serviceId:s.id,addonId:aid||'',staffId:sid||'',date,time,status:'Confirmed',total:s.price+(aid?a.price:0),duration:s.duration+(aid?a.duration:0),source:'direct',created:new Date().toISOString()};db.bookings.unshift(b);save();alert('Booking confirmed in this prototype.');render()}}let cf=$('#customerForm');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),phone=f.get('phone').replace(/[\s-]/g,'');if(db.customers.some(c=>c.phone===phone)){alert('This phone number already exists.');return}db.customers.unshift({id:uid(),name:f.get('name'),phone,consent:f.get('consent')==='on',created:today(),lastVisit:f.get('lastVisit')||'',lastService:f.get('lastService')||''});save();render()};let sf=$('#serviceForm');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf);db.services.push({id:uid(),name:f.get('name'),category:f.get('category'),price:+f.get('price'),duration:+f.get('duration'),cycle:+f.get('cycle'),active:true});save();render()};let wf=$('#walletForm');if(wf)wf.onsubmit=e=>{e.preventDefault();let f=new FormData(wf),type=f.get('type'),amt=+f.get('amount'),bonus=+f.get('bonus')||0,cid=f.get('customerId'),reason=f.get('reason');if(['adjust','refund'].includes(type)&&!reason.trim()){alert('Please enter a reason for this adjustment/refund.');return}if(type==='topup'&&amt<db.settings.minimumTopup){alert('Minimum top-up is '+money(db.settings.minimumTopup));return}let delta=type==='topup'?amt+bonus:-amt;if(type!=='topup'&&walletBalance(cid)<amt){alert('Insufficient salon credit balance.');return}addItem(db.wallet,{customerId:cid,type,label:type==='topup'?'Top-up + bonus':type==='use'?'Credit used at checkout':type==='refund'?'Refund / reversal':'Owner adjustment',paid:type==='topup'?amt:0,bonus:type==='topup'?bonus:0,delta,date:today(),reason:reason||'',balanceAfter:walletBalance(cid)+delta});render()};let rf=$('#referralForm');if(rf)rf.onsubmit=e=>{e.preventDefault();let f=new FormData(rf),phone=f.get('phone');if(db.customers.some(c=>c.phone===phone)||db.referrals.some(r=>r.phone===phone)){alert('That phone number is already registered or referred.');return}addItem(db.referrals,{referrerId:f.get('referrerId'),name:f.get('name'),phone,code:'REF-'+uid(),status:'Pending visit',reward:db.settings.referrerReward,created:today()});render()};let setf=$('#settingsForm');if(setf)setf.onsubmit=e=>{e.preventDefault();let f=new FormData(setf);db.salon.name=f.get('name');db.salon.hours=f.get('hours');['bonus','minimumTopup','expiryDays','referrerReward','newCustomerDiscount'].forEach(k=>db.settings[k]=+f.get(k));db.settings.reminderEnabled=f.get('reminderEnabled')==='on';save();render()};let stf=$('#staffForm');if(stf)stf.onsubmit=e=>{e.preventDefault();let name=new FormData(stf).get('name');db.staff.push({id:uid(),name,active:true});save();render()};let q=$('#customerSearch');if(q)q.oninput=()=>$('#customerResults').innerHTML=customerList(db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q.value.toLowerCase())));let filt=$('#bookingFilter');if(filt)filt.onchange=()=>$('#bookingResults').innerHTML=bookingList(db.bookings.filter(b=>filt.value==='All'||b.status===filt.value));let qr=$('#queueReminders');if(qr)qr.onclick=()=>{db.customers.filter(c=>c.consent&&c.lastVisit&&plus(c.lastVisit,service(c.lastService).cycle)<=today()).forEach(c=>queueReminder(c.id,true));save();render()};let ex=$('#exportCsv');if(ex)ex.onclick=()=>downloadCsv('salon-bookings.csv',[['Customer','Phone','Service','Date','Time','Staff','Status','Total'],...db.bookings.map(b=>[customer(b.customerId).name,customer(b.customerId).phone,service(b.serviceId).name,b.date,b.time,staff(b.staffId).name,b.status,b.total])]);let ec=$('#exportCustomers');if(ec)ec.onclick=()=>downloadCsv('salon-customers.csv',[['Name','Phone','Consent','Last visit','Last service','Wallet balance'],...db.customers.map(c=>[c.name,c.phone,c.consent?'Yes':'No',c.lastVisit,service(c.lastService).name,walletBalance(c.id)])]);let reset=$('#resetData');if(reset)reset.onclick=()=>{if(confirm('Reset all saved SalonLoop data on this browser? This cannot be undone.')){db=structuredClone(defaults);save();render()}}}
function completeBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b||b.status==='Completed')return;b.status='Completed';db.visits.unshift({id:uid(),bookingId:b.id,customerId:b.customerId,serviceId:b.serviceId,staffId:b.staffId,date:today(),amount:b.total});let c=customer(b.customerId);c.lastVisit=today();c.lastService=b.serviceId;let ref=db.referrals.find(r=>r.phone===c.phone&&r.status==='Pending visit');if(ref)approveReferral(ref.id,true);save();render()}
function queueReminder(cid,silent=false){let c=customer(cid);if(!db.settings.reminderEnabled){if(!silent)alert('Reminder queue is disabled in Settings.');return}if(!c.consent){if(!silent)alert('No marketing/reminder consent recorded for this customer. Obtain permission first.');return}let sv=service(c.lastService);let due=c.lastVisit?plus(c.lastVisit,sv.cycle):today();if(db.reminders.some(r=>r.customerId===cid&&r.due===due&&['Scheduled','Delivered'].includes(r.status))){if(!silent)alert('A reminder already exists for this service cycle.');return}addItem(db.reminders,{customerId:cid,due,date:today(),status:'Scheduled',message:`Hi ${c.name}, your last ${sv.name} at ${db.salon.name} was on ${fmtDate(c.lastVisit)}. Suggested next visit: ${fmtDate(due)}. Please book when convenient.`});if(!silent)render()}
function approveReferral(id,fromVisit=false){let r=db.referrals.find(x=>x.id===id);if(!r||r.status!=='Pending visit')return;if(!fromVisit&&!confirm('Confirm the referred customer has completed and paid for their first eligible service?'))return;r.status='Rewarded';let existing=db.customers.find(c=>c.phone===r.phone);if(!existing){existing={id:uid(),name:r.name,phone:r.phone,consent:false,created:today(),lastVisit:today(),lastService:''};db.customers.push(existing)}addItem(db.wallet,{customerId:r.referrerId,type:'referral',label:'Referral reward',paid:0,bonus:r.reward,delta:r.reward,date:today(),reason:'Approved after eligible paid visit',balanceAfter:walletBalance(r.referrerId)+r.reward});save();render()}
function walletModal(cid){$('#modalHost').innerHTML=`<div class="modalback"><div class="modal"><div class="between"><h2>Wallet action</h2><button id="closeModal" class="secondary">Close</button></div><p>${customer(cid).name} · Current balance <strong>${money(walletBalance(cid))}</strong></p><form id="quickWallet"><input type="hidden" name="cid" value="${cid}"><label>Action</label><select name="type"><option value="topup">Top-up (simulated)</option><option value="use">Use credit</option></select><label>Amount (₹)</label><input name="amount" type="number" min="1" required><label>Bonus (₹)</label><input name="bonus" type="number" min="0" value="${db.settings.bonus}"><button class="green" style="margin-top:14px">Record</button></form></div></div>`;$('#closeModal').onclick=()=>$('#modalHost').innerHTML='';$('#quickWallet').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),amt=+f.get('amount'),bonus=+f.get('bonus')||0;if(type==='topup'&&amt<db.settings.minimumTopup){alert('Minimum top-up is '+money(db.settings.minimumTopup));return}if(type==='use'&&walletBalance(cid)<amt){alert('Insufficient salon credit.');return}let delta=type==='topup'?amt+bonus:-amt;addItem(db.wallet,{customerId:cid,type,label:type==='topup'?'Top-up + bonus':'Credit used at checkout',paid:type==='topup'?amt:0,bonus:type==='topup'?bonus:0,delta,date:today(),reason:'Quick wallet action',balanceAfter:walletBalance(cid)+delta});$('#modalHost').innerHTML='';render()}}
function editService(id){let s=service(id);$('#modalHost').innerHTML=`<div class="modalback"><div class="modal"><div class="between"><h2>Edit service</h2><button id="closeModal" class="secondary">Close</button></div><form id="editServiceForm"><label>Name</label><input name="name" value="${s.name}" required><label>Category</label><select name="category">${['Hair','Grooming','Skin','Add-on','Other'].map(x=>`<option ${x===s.category?'selected':''}>${x}</option>`).join('')}</select><div class="formgrid"><div><label>Price (₹)</label><input name="price" type="number" value="${s.price}" min="0" required></div><div><label>Duration</label><input name="duration" type="number" value="${s.duration}" min="1" required></div><div><label>Repeat cycle days</label><input name="cycle" type="number" value="${s.cycle}" min="1" required></div></div><button class="green" style="margin-top:12px">Save changes</button></form></div></div>`;$('#closeModal').onclick=()=>$('#modalHost').innerHTML='';$('#editServiceForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(s,{name:f.get('name'),category:f.get('category'),price:+f.get('price'),duration:+f.get('duration'),cycle:+f.get('cycle')});save();$('#modalHost').innerHTML='';render()}}
function copyText(s){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>alert('Copied: '+s)).catch(()=>prompt('Copy this code',s));else prompt('Copy this code',s)}function downloadCsv(name,rows){let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
